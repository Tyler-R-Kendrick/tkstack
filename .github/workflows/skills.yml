name: Skill contracts and documentation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: skill-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked command dependencies
        run: |
          python -m venv .tkstack/runtime/command-schema
          .tkstack/runtime/command-schema/bin/python -m pip install --require-hashes -r skills/learn/skills/codify/requirements/requirements.lock
      - name: Install locked mutation tool
        run: |
          timeout 30s python -m venv .tkstack/runtime/mutation
          timeout 180s .tkstack/runtime/mutation/bin/python -m pip install --require-hashes -r skills/constrain/requirements/requirements.lock
      - name: Install checksum-pinned Lean 4.19.0
        run: |
          curl -fSL --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  '"$RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP" --wildcards 'lean-4.19.0-linux/bin/lean' 'lean-4.19.0-linux/lib/lean/*'
      - name: Check Lean proof and bridge to SQLite
        run: LEAN_BIN="$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" python -B -m unittest discover -s tests -p test_experiment_lean.py -v
      - name: Check every owned skill and executable artifact
        run: .tkstack/runtime/command-schema/bin/python -B src/check_skills.py
      - name: Check reviewed documentation
        run: python -B src/check_docs.py check
      - name: Enforce test value and repository sparsity
        run: .tkstack/runtime/command-schema/bin/python -B skills/constrain/scripts/constrain.py check --repo . --strict-dependencies
      - name: Provision native discovery client and current tool runtimes
        run: |
          python -c 'import importlib.util; from pathlib import Path; root=Path.cwd(); spec=importlib.util.spec_from_file_location("latest", root / "integrations/latest.py"); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); generation=module.prepare_runtime(root); module.publish(root / ".tkstack/runtime/current", generation)'
          .tkstack/runtime/current/bin/codex --version
          echo "$PWD/.tkstack/runtime/current/bin" >> "$GITHUB_PATH"
      - name: Run the full offline regression suite
        env:
          REPO_QUALITY_GATE: "1"
          TKSTACK_COSMIC_RAY_BIN: ${{ github.workspace }}/.tkstack/runtime/mutation/bin/cosmic-ray
          TKSTACK_OFFLINE: "1"
        run: .tkstack/runtime/command-schema/bin/python -B -m unittest discover -s tests -v
