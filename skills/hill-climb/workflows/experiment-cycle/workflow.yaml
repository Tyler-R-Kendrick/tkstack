name: experiment-cycle
description: Execute a bounded list of scoped experiment actions and emit their receipts.
inputs:
  request_paths:
    type: array
    description: Request files relative to the caller-selected request directory.
actions:
  - kind: InvokeFunctionTool
    id: execute_actions
    functionName: execute_requests
    arguments:
      request_paths: =Workflow.Inputs.request_paths
    output:
      result: Local.receipt
      autoSend: false
  - kind: SendActivity
    id: emit_receipt
    activity: =Local.receipt
